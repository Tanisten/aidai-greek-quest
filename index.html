let currentStep = 0;
let storyHistory = [];

function renderStep() {
    const gameDiv = document.getElementById("game");
    const step = storySteps[currentStep];
    
    let html = `<div class="step-counter">Приключение ${currentStep + 1}/7</div>`;
    html += `<h2>${step.title}</h2>`;
    html += `<p>${step.text}</p>`;
    
    if (currentStep === 0 || currentStep === 3 || currentStep === 5) {
        html += `<div class="sisters-note">С тобой твои сёстры: <strong>${sisters[0]}</strong> и <strong>${sisters[1]}</strong></div>`;
    }
    
    html += `<img src="${step.img}" alt="Иллюстрация шага ${currentStep + 1}">`;
    html += `<div style="margin-top:20px;">`;
    
    step.choices.forEach((choice, index) => {
        html += `<button onclick="makeChoice(${index})">${choice.text}</button>`;
    });
    
    html += `</div>`;
    
    if (storyHistory.length > 0) {
        html += `<br><button onclick="goBack()" style="background:linear-gradient(45deg, #8E2DE2, #4A00E0);">← Вернуться к предыдущему выбору</button>`;
    }
    
    gameDiv.innerHTML = html;
}

function makeChoice(choiceIndex) {
    const currentStepData = storySteps[currentStep];
    const choice = currentStepData.choices[choiceIndex];
    
    storyHistory.push({step: currentStep, choice: choiceIndex});
    showEnding(choice.ending);
}

function showEnding(ending) {
    const gameDiv = document.getElementById("game");
    
    let html = `<div class="ending-screen">`;
    html += `<h2>${ending.title}</h2>`;
    html += `<p>${ending.text}</p>`;
    html += `<img src="${ending.img}" alt="Иллюстрация концовки">`;
    html += `<br><br>`;
    
    if (currentStep < storySteps.length - 1) {
        html += `<button onclick="nextStep()">Продолжить путь →</button>`;
    } else {
        html += `<h2 style="color:#FFD700;">🎉 Твоя легенда завершена! 🎉</h2>`;
        html += `<p>Ты прошла все 7 этапов приключения и создала свою уникальную историю в Древней Греции.</p>`;
    }
    
    html += `<button onclick="restartGame()" class="restart-btn">✨ Начать новую историю</button>`;
    html += `<button onclick="viewHistory()" class="history-btn">📖 Посмотреть историю выбора</button>`;
    html += `</div>`;
    
    gameDiv.innerHTML = html;
}

function nextStep() {
    currentStep++;
    renderStep();
}

function goBack() {
    if (storyHistory.length > 0) {
        storyHistory.pop();
        
        if (storyHistory.length > 0) {
            const prev = storyHistory[storyHistory.length - 1];
            currentStep = prev.step;
        } else {
            currentStep = 0;
        }
        
        renderStep();
    }
}

function viewHistory() {
    const gameDiv = document.getElementById("game");
    
    let html = `<h2>📜 История приключений Айдай</h2>`;
    html += `<div style="text-align:left; max-width:500px; margin:auto; background:rgba(255,255,255,0.1); padding:20px; border-radius:10px;">`;
    
    if (storyHistory.length === 0) {
        html += `<p>История ещё не началась. Сделай свой первый выбор!</p>`;
    } else {
        storyHistory.forEach((record, index) => {
            const step = storySteps[record.step];
            const choice = step.choices[record.choice];
            html += `<p><strong>Этап ${record.step + 1}:</strong> ${step.title}</p>`;
            html += `<p style="margin-left:20px; color:#87CEEB;">→ ${choice.text}</p>`;
            html += `<hr style="border-color:rgba(255,255,255,0.1)">`;
        });
    }
    
    html += `</div>`;
    html += `<br><button onclick="showEnding(storySteps[currentStep].choices[storyHistory[storyHistory.length-1]?.choice || 0].ending)">← Вернуться к концовке</button>`;
    html += `<button onclick="restartGame()" class="restart-btn">Начать заново</button>`;
    
    gameDiv.innerHTML = html;
}

function restartGame() {
    currentStep = 0;
    storyHistory = [];
    renderStep();
}

// Начинаем игру
renderStep();
</script>
